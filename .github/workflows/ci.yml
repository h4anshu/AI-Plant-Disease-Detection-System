name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml-service:
    name: ml-service (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ml-service
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # same as the Dockerfile
          cache: pip
          cache-dependency-path: |
            ml-service/requirements.txt
            ml-service/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # model weights are tracked in git, so the golden regression tests run here too
      - run: pytest -p no:cacheprovider

  server:
    name: server (Jest + supertest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # same as the Dockerfile
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
      - run: npm ci
      - run: npm test

  client:
    name: client (oxlint + Vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # vitest 5, jsdom 30 and jest-dom need Node >= 22 (server stays on 20 = its Dockerfile)
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
